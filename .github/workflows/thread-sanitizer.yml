name: Thread Sanitizer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  diagnostics-concurrency:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure ThreadSanitizer build
        run: cmake -S . -B build/tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DDRS_ENABLE_THREAD_SANITIZER=ON

      - name: Build diagnostics and Sprint 4-6 concurrency regressions
        run: cmake --build build/tsan --target drs_sprint4_entry_diagnostics_concurrency_tests drs_sprint4_concurrency_soak_tests drs_sprint5_integration_hardening_tests drs_sprint6_integration_hardening_tests

      - name: Run diagnostics concurrency regression under ThreadSanitizer
        run: ./build/tsan/tests/drs_sprint4_entry_diagnostics_concurrency_tests_artefacts/Debug/drs_sprint4_entry_diagnostics_concurrency_tests

      - name: Run Sprint 4 concurrency soak under ThreadSanitizer
        run: ./build/tsan/tests/drs_sprint4_concurrency_soak_tests_artefacts/Debug/drs_sprint4_concurrency_soak_tests

      - name: Run Sprint 5 Preview integration soak under ThreadSanitizer
        run: ./build/tsan/tests/drs_sprint5_integration_hardening_tests_artefacts/Debug/drs_sprint5_integration_hardening_tests

      - name: Run Sprint 6 Publish integration soak under ThreadSanitizer
        run: ./build/tsan/tests/drs_sprint6_integration_hardening_tests_artefacts/Debug/drs_sprint6_integration_hardening_tests
