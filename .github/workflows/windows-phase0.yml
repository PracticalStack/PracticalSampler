name: Windows Phase 0

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap-and-smoke-test:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build aggregate, verify CTest executables, and run tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-windows.ps1 -RunTests

      - name: Run deterministic diagnostics concurrency regression
        shell: pwsh
        run: |

        $vswhere = Join-Path ${env:ProgramFiles(x86)} `
        "Microsoft Visual Studio\Installer\vswhere.exe"

        $vsRoot = & $vswhere `
        -latest `
        -products * `
        -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
        -property installationPath

        if (-not $vsRoot) {
            throw "Visual Studio 2022 with the C++ build tools was not found."
        }

        $vsDevCmd = Join-Path $vsRoot "Common7\Tools\VsDevCmd.bat"

          cmd /c "call `"$vsDevCmd`" -arch=amd64 && cmake --build build/vs2022-debug --target drs_sprint4_entry_diagnostics_concurrency_tests && build\vs2022-debug\tests\drs_sprint4_entry_diagnostics_concurrency_tests_artefacts\Debug\drs_sprint4_entry_diagnostics_concurrency_tests.exe"
