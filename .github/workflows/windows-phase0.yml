name: Windows Phase 0

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap-and-smoke-test:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap and run smoke tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-windows.ps1 -RunTests
